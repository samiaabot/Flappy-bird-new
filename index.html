<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Canvas</title>
    <style>
        canvas {
            border: 1px solid #000;
            background: #ffc;
            display: block;
            margin: 0 auto;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
        integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
</head>

<body>
    <canvas id="quadro" width="400" height="500"></canvas>

    <script>
        $(document).ready(function () {
            var canvas = $("#quadro")[0];
            var ctx = canvas.getContext("2d");
            var frame;
            var contPontos = 0;
            var jogo = true;

            var passaro = {
                x: 50,
                y: 100,
                largura: 10, 
                vy: 0,
                gravidade: 0.35,
                pulo: -6.5,
                cor: "yellow",
                
                atualiza: function () {
                    this.vy += this.gravidade;
                    this.y += this.vy;

                    // Limite 
                    if (this.y - this.largura <= 0) {
                        this.y = this.largura;
                        this.vy = 0;
                    }
                },
                desenha: function () {
                    ctx.fillStyle = this.cor;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.largura, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.closePath();
                },
                pular: function () {
                    this.vy = this.pulo;
                }
            };

            var cano = {
                x: 400,
                largura: 50,
                velocidade: 2.5,
                topoCano: -350, 
                
                atualiza: function () {
                    this.x -= this.velocidade;

                    if (this.x < -this.largura) {
                        this.x = canvas.width;
                        this.topoCano = - ((Math.random() * 250) + 150);
                        contPontos++;
                    }
                },
                desenha: function () {
                    ctx.fillStyle = "black";
                    ctx.fillRect(this.x, 0, this.largura, canvas.height);

                    //Desenhando o buraco no cano
                    var espacoCanoY = canvas.height + this.topoCano;
                    var espacoCanoAltura = 150;
                    ctx.fillStyle = "#ffc";
                    ctx.fillRect(this.x, espacoCanoY, this.largura, espacoCanoAltura);
                }
            };

            // colisão
            function colisao(passaro, cano) {
                var espacoCanoY = canvas.height + cano.topoCano;
                var espacoCanoAltura = 150;

                var canoCima = (passaro.y - passaro.largura < espacoCanoY);
                var canoBaixo = (passaro.y + passaro.largura > espacoCanoY + espacoCanoAltura);

                if ((passaro.x + passaro.largura > cano.x) && (passaro.x - passaro.largura < cano.x + cano.largura) && (canoCima || canoBaixo)) {
                    return true;
                }

                if (passaro.y + passaro.largura >= canvas.height) {
                    return true;
                }

                return false;
            }

            function pontuacao() {
                ctx.font = "20px Georgia";
                ctx.fillStyle = "black";
                ctx.fillText("Pontos: " + contPontos, 10, 30);
            }

            function limpar() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            function animacao() {
                limpar();

                passaro.atualiza();
                cano.atualiza();

                cano.desenha();
                passaro.desenha();
                pontuacao();

                if (colisao(passaro, cano)) {
                    cancelAnimationFrame(frame);
                    jogo = false; 
                    ctx.font = "24px Georgia";
                    ctx.fillStyle = "red";
                    ctx.fillText("Você perdeu", canvas.width / 4, canvas.height / 2);
                    return;
                }

                frame = requestAnimationFrame(animacao);
            }

            animacao();

            $(document).keydown(function (event) {
                if (event.which == 32 && jogo) { 
                    passaro.pular();
                }
            });
        });
    </script>
</body>

</html>
